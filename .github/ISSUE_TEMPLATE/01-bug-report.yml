name: Bug report
description: Something in Hoizr does not work as expected.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Security vulnerabilities must not be reported here.** Follow the [security policy](https://github.com/roop37/hoizr-dotgithub/blob/main/SECURITY.md) instead.

        For setup questions, check the [local development guide](https://github.com/roop37/hoizr-walkthrough/blob/main/docs/09-local-development.md) first.
  - type: dropdown
    id: repo
    attributes:
      label: Which repo?
      description: The repository where the bug shows up. Pick more than one if the bug crosses services.
      multiple: true
      options:
        - main-server
        - customer-server
        - hoizr-worker
        - tracking-server
        - hoizr-shared
        - hoizr-client
        - business-client
        - internal-admin-client
        - hoizr-artist-client
        - hoizr-scanner-app
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, starting from a fresh local setup if possible.
      placeholder: |
        1. Start main-server and business-client
        2. Open ...
        3. Click ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste server logs, browser console output or GraphQL errors. This is formatted as code automatically. Remove tokens, keys and personal data first.
      render: shell
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit hash (or date) of each repository you are running.
      placeholder: "main-server @ abc1234"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, package manager, MongoDB and Redis versions, browser or device. For the scanner app, the Flutter version and device model.
      placeholder: |
        OS: macOS 15
        Node.js: 20.x
        Browser: Chrome 130
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not been reported yet.
          required: true
        - label: I removed secrets, tokens and personal data from everything above.
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/roop37/hoizr-dotgithub/blob/main/CODE_OF_CONDUCT.md).
          required: true
