name: Feature request
description: Suggest a new capability or an improvement to an existing one.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Describing the problem first helps us find the right solution, which may differ from the first one that comes to mind.
  - type: dropdown
    id: repo
    attributes:
      label: Which repo?
      description: The repositories this feature would touch. Pick all that apply.
      multiple: true
      options:
        - main-server
        - customer-server
        - hoizr-worker
        - tracking-server
        - hoizr-shared
        - hoizr-client
        - business-client
        - internal-admin-client
        - hoizr-artist-client
        - hoizr-scanner-app
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who runs into it (fan, organizer, artist, door staff, admin, developer) and what happens today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like to happen. Mention schema, API or UI changes if you have them in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - Yes, I would like to open a pull request
        - Maybe, with some guidance
        - No, I am only suggesting it
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not been requested yet.
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/roop37/hoizr-dotgithub/blob/main/CODE_OF_CONDUCT.md).
          required: true
